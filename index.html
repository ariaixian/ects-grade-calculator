<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calculate a credit-weighted course average using ECTS values.">
  <title>ECTS Grade Calculator</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="script.js?v=3" defer></script>
</head>
<body>
  <a class="source-link" href="https://github.com/ariaixian/ects-grade-calculator">Source</a>

  <header class="masthead">
    <p class="kicker">ECTS-weighted study tool</p>
    <h1>Grade Calculator</h1>
    <p class="intro">Add each course, its grade, and its credits.</p>
  </header>

  <main>
    <section class="calculator" aria-labelledby="courses-heading">
      <h2 id="courses-heading" class="sr-only">Courses</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Course name</th>
              <th scope="col">Grade</th>
              <th scope="col">ECTS</th>
              <th scope="col">Delete</th>
            </tr>
          </thead>
          <tbody id="course-rows"></tbody>
        </table>
      </div>

      <div class="actions" aria-label="Course actions">
        <button id="add-course" type="button">＋ Add course</button>
        <span aria-hidden="true">✶</span>
        <button id="delete-selected" type="button">Delete selected</button>
      </div>

      <button id="calculate" class="calculate" type="button">Calculate average</button>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </section>

    <section id="result-card" class="result" aria-labelledby="result-heading" hidden>
      <h2 id="result-heading">You will get</h2>
      <output id="average">—</output>
      <p><span id="course-count">—</span> courses · <span id="total-ects">—</span> ECTS</p>
    </section>

    <div class="utility-actions">
      <button id="print" type="button">Print / save PDF</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <time id="clock" aria-label="Current time">--✶--</time>
    <p class="privacy-note">Calculated locally. Your course data never leaves this page.</p>
  </main>

  <div id="star-field" aria-hidden="true"></div>
</body>
</html>
